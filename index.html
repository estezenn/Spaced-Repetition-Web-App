<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spaced Repetition</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <div class="sidebar">
      <div class="logo">Spaced<span>Repetition</span></div>

      <div class="nav-item active" onclick="setNav(this,'bugün')">
        Today
      </div>

      <div class="nav-item" onclick="setNav(this,'takvim')">
        Calendar
      </div>

      <div class="nav-item" onclick="setNav(this,'dersler')">
        My Lessons
      </div>

      <div style="margin-top:auto;">
        <div class="nav-item" onclick="clearAllData()" style="color:rgba(255,255,255,0.4);font-size:12px;">
          Reset
        </div>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="page-title">Today</div>

        <div class="topbar-right">
          <div id="cal-tab-btns" style="display:none;gap:4px;align-items:center;">
            <button onclick="setCalView('weekly')" id="btn-weekly">Weekly</button>
            <button onclick="setCalView('monthly')" id="btn-monthly">Monthly</button>
          </div>

          <div id="bugun-view-toggle" class="view-toggle">
            <button class="view-toggle-btn active" onclick="setBugunView('list',this)">List</button>
            <button class="view-toggle-btn" onclick="setBugunView('group',this)">By Lesson</button>
          </div>

          <button class="add-btn" onclick="showModal()">+ Add Lesson</button>
        </div>
      </div>

      <div class="content">

        <div id="view-bugün">
          <div class="stats-row" id="stats-row"></div>
          <div class="filter-tabs" id="filter-tabs"></div>
          <div id="today-content"></div>
          <div class="section-label">All Lessons — Progress</div>
          <div id="all-lessons"></div>
        </div>

        <div id="view-takvim" class="hidden">
          <div class="cal-nav">
            <button class="cal-arrow" onclick="changeMonth(-1)">‹</button>
            <div class="cal-title" id="cal-title"></div>
            <button class="cal-arrow" onclick="changeMonth(1)">›</button>
          </div>
          <div id="cal-container"></div>
        </div>

        <div id="view-dersler" class="hidden">
          <div class="section-label">Registered Lessons</div>
          <div id="dersler-list"></div>
        </div>

      </div>

      <div id="modal-area"></div>
      <div id="cascade-area"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
